name: Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KARAL_UPLOAD_KEYSTORE: ${{ runner.temp }}/karal-release.jks
      KARAL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.KARAL_UPLOAD_KEYSTORE_BASE64 }}
      KARAL_UPLOAD_STORE_PASSWORD: ${{ secrets.KARAL_UPLOAD_STORE_PASSWORD }}
      KARAL_UPLOAD_KEY_ALIAS: ${{ secrets.KARAL_UPLOAD_KEY_ALIAS }}
      KARAL_UPLOAD_KEY_PASSWORD: ${{ secrets.KARAL_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare release keystore (optional)
        if: ${{ env.KARAL_UPLOAD_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KARAL_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$KARAL_UPLOAD_KEYSTORE"
          ls -l "$KARAL_UPLOAD_KEYSTORE"

      - name: Build, test and lint
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Build signed release (optional)
        if: ${{ env.KARAL_UPLOAD_KEYSTORE_BASE64 != '' }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload signed release APK
        if: ${{ env.KARAL_UPLOAD_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: karal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
