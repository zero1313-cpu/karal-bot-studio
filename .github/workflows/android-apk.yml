name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew --no-daemon clean

      - name: Run Core Tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Run Android Unit Tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            core/build/reports/**
            core/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
