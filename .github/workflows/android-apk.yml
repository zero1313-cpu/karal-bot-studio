name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run Core Tests
        run: ./gradlew --no-daemon :core:test

      - name: Run Android Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karal-build-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
